generator_ckpt: <PATH_TO_ODE_STUDENT_CKPT>              # stage 3 output
real_score_controlnet_model_ckpt_path: <PATH_TO_TEACHER_CKPT>   # stage 1 output
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
real_name_controlnet: Wan2.1-I2V-14B-480P
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
# sharding_strategy: hybrid_full
sharding_strategy: full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 500
guide_scale: 5.0  # classifier free guidance scale
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 21
- 48
- 30
- 52
distribution_loss: dmd
trainer: distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: true
model_kwargs:
  timestep_shift: 5.0
  controlnet_layers: 15
generator_model_kwargs:
  timestep_shift: 5.0
  controlnet_layers: 15
i2v: false
use_change_force: false
all_forces: true
gradient_accumulation_steps: 1
# ---- Mixing ratios (hierarchical, applied per batch) ----
diverse_synthetic_data_ratio: 2   # source: diverse : synthetic
dlocal_global_force_ratio: 4      # force: local(point) : global(wind)
dchange_no_change_ratio: 3        # change : preserve(no_change)
# ---- Image-scope train/val split for the diverse sources (null = use all) ----
point_diverse_split_label: train  # point diverse (+change): 'train' / 'val' / null
wind_diverse_split_label: train   # wind diverse (+change):  'train' / 'val' / null
start_step: 0
debug_video_save_path: ./debug_videos/dmd-everything
remove_carnation: true
